<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant | Payment Success</title>
    <meta name="description" content="PayPal return page for online orders." />
    <link rel="icon" type="image/svg+xml" href="assets/demo-logo.svg" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .paypal-success {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .paypal-success-card {
        width: min(640px, 100%);
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(16, 21, 21, 0.9);
        box-shadow: var(--shadow);
      }

      .paypal-success-card h1 {
        margin: 0;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 6vw, 3.2rem);
        line-height: 1;
      }

      .paypal-success-card p {
        margin: 12px 0 0;
        color: var(--soft);
      }

      .paypal-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }
    </style>
  </head>
  <body>
    <main class="paypal-success">
      <section class="paypal-success-card">
        <p class="eyebrow">Payment</p>
        <h1 id="paymentTitle">PayPal Rückkehr</h1>
        <p id="paymentMessage">Wir prüfen deine Zahlung und bereiten die Bestellung vor.</p>
        <div class="paypal-actions">
          <a class="button primary" href="index.html">Zur Startseite</a>
          <a class="button glass" id="whatsappLink" href="#" rel="noopener" target="_blank">WhatsApp erneut öffnen</a>
        </div>
      </section>
    </main>

    <script src="api-client.js"></script>
    <script>
      (async function () {
        const PENDING_PAYPAL_ORDER_KEY = 'bagoPendingPaypalOrder';
        const LAST_SHARED_PAYPAL_TX_KEY = 'bagoLastSharedPaypalTx';
        const WHATSAPP_CONFIRMATION_KEY = 'bagoWhatsappConfirmation';

        const titleNode = document.querySelector('#paymentTitle');
        const messageNode = document.querySelector('#paymentMessage');
        const whatsappLink = document.querySelector('#whatsappLink');

        const privateVenue =
          window.BAGO_PRIVATE &&
          typeof window.BAGO_PRIVATE === 'object' &&
          window.BAGO_PRIVATE.venue &&
          typeof window.BAGO_PRIVATE.venue === 'object'
            ? window.BAGO_PRIVATE.venue
            : {};

        const venue = {
          name: 'Restaurant',
          whatsappNumber: '',
          ...((window.BAGO_VENUE && typeof window.BAGO_VENUE === 'object' ? window.BAGO_VENUE : null) || {}),
          ...privateVenue
        };

        try {
          const config = await window.BagoApi?.getConfig?.();
          if (config?.venue) {
            Object.assign(venue, Object.fromEntries(Object.entries(config.venue).filter(([, value]) => value !== '')));
          }
        } catch (error) {
          console.error('Runtime config failed:', error);
        }

        function getWhatsAppBaseUrl() {
          const cleanPhone = String(venue.whatsappNumber || '').replace(/\D/g, '');
          return `https://wa.me/${cleanPhone}`;
        }

        function readPendingOrder() {
          try {
            const raw = localStorage.getItem(PENDING_PAYPAL_ORDER_KEY);
            return raw ? JSON.parse(raw) : null;
          } catch {
            return null;
          }
        }

        function openWhatsApp(url) {
          const popup = window.open(url, '_blank', 'noopener');
          if (!popup) {
            markWhatsappConfirmationAsLeftPage();
            window.location.href = url;
            return false;
          }
          return true;
        }

        function readPendingWhatsappConfirmation() {
          try {
            const raw = localStorage.getItem(WHATSAPP_CONFIRMATION_KEY);
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            if (!parsed || typeof parsed !== 'object') return null;
            return parsed;
          } catch {
            return null;
          }
        }

        function writePendingWhatsappConfirmation(payload) {
          localStorage.setItem(WHATSAPP_CONFIRMATION_KEY, JSON.stringify(payload));
        }

        function armWhatsappConfirmationPrompt(order) {
          writePendingWhatsappConfirmation({
            orderNumber: order?.orderNumber || null,
            orderId: order?.orderId || null,
            createdAt: Date.now(),
            hasLeftPage: false
          });
        }

        function markWhatsappConfirmationAsLeftPage() {
          const pending = readPendingWhatsappConfirmation();
          if (!pending || pending.hasLeftPage) return;
          writePendingWhatsappConfirmation({
            ...pending,
            hasLeftPage: true
          });
        }

        async function updateOrderStatus(orderId, status, paymentReference) {
          if (!orderId || !window.BagoApi?.updateOrderStatus) return;
          await window.BagoApi.updateOrderStatus(orderId, status, paymentReference);
        }

        function normalizeTrackingPayload(payload) {
          if (!payload || typeof payload !== 'object' || Array.isArray(payload)) return {};
          try {
            return JSON.parse(JSON.stringify(payload));
          } catch {
            return {};
          }
        }

        async function trackOrderEvent(orderId, eventType, payload, source) {
          try {
            if (!window.BagoApi?.createOrderEvent || !orderId || !eventType) return;
            await window.BagoApi.createOrderEvent(
              orderId,
              String(eventType).trim(),
              normalizeTrackingPayload(payload || {}),
              String(source || 'paypal_success').trim() || 'paypal_success'
            );
          } catch (error) {
            console.error('Order event tracking failed:', error);
          }
        }

        function buildPaidWhatsAppUrl(order, transactionId) {
          const money = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'EUR' });
          const totals = order.totals || { subtotal: 0, service: 0, voucherDiscount: 0, total: 0 };
          const lines = order.items || [];
          const scheduleLabel = order.scheduleLabel || 'As soon as possible';

          const messageLines = [
            `New order #${order.orderNumber || ''}`.trim(),
            `Restaurant: ${venue.name || 'Restaurant'}`,
            `Customer Name: ${order.customerName || '-'}`,
            `Phone: ${order.customerPhone || '-'}`,
            ...(order.customerEmail ? [`Email: ${order.customerEmail}`] : []),
            'Payment Method: PayPal',
            `Pickup: ${scheduleLabel}`,
            'Payment Status: PAID',
            `PayPal Transaction ID: ${transactionId || 'N/A'}`,
            '',
            'Order Details:',
            ...lines.map((item) => `- ${item.quantity}x ${item.name} (${money.format(item.lineTotal || 0)})`),
            '',
            `Subtotal: ${money.format(totals.subtotal || 0)}`,
            `Service: ${money.format(totals.service || 0)}`,
            ...(totals.voucherDiscount > 0 ? [`Voucher: -${money.format(totals.voucherDiscount || 0)}`] : []),
            `Order Total: ${money.format(totals.total || 0)}`
          ];

          return `${getWhatsAppBaseUrl()}?text=${encodeURIComponent(messageLines.join('\n'))}`;
        }

        const params = new URLSearchParams(window.location.search);
        const transactionId = params.get('tx') || '';
        const status = String(params.get('st') || '').toLowerCase();
        const isPaid = status === 'completed' || status === 'paid' || status === 'success' || (Boolean(transactionId) && !status);
        const order = readPendingOrder();

        if (!order) {
          titleNode.textContent = 'Keine Bestelldaten gefunden';
          messageNode.textContent = 'Bitte kehre zur Startseite zurück und starte die Bestellung erneut.';
          whatsappLink.hidden = true;
          return;
        }

        if (!isPaid) {
          trackOrderEvent(order.orderId, 'paypal_return_unpaid', { paymentStatus: status || null }, 'paypal_success');
          titleNode.textContent = 'Zahlung nicht bestätigt';
          messageNode.textContent = 'PayPal hat die Zahlung noch nicht als abgeschlossen gemeldet.';
          whatsappLink.hidden = true;
          return;
        }

        const lastSharedTx = localStorage.getItem(LAST_SHARED_PAYPAL_TX_KEY);
        if (transactionId && transactionId === lastSharedTx) {
          titleNode.textContent = 'Zahlung bereits verarbeitet';
          messageNode.textContent = 'Diese PayPal-Transaktion wurde bereits per WhatsApp weitergeleitet.';
          whatsappLink.hidden = true;
          return;
        }

        const whatsappUrl = buildPaidWhatsAppUrl(order, transactionId);
        whatsappLink.href = whatsappUrl;
        whatsappLink.addEventListener('click', () => {
          armWhatsappConfirmationPrompt(order);
        });
        titleNode.textContent = 'Zahlung erfolgreich';
        messageNode.textContent = 'WhatsApp wird mit den Bestelldaten, Kundendaten und Transaktions-ID geöffnet.';
        updateOrderStatus(order.orderId, 'paid', transactionId);
        trackOrderEvent(
          order.orderId,
          'paypal_paid',
          {
            transactionId: transactionId || null,
            paymentStatus: status || 'completed'
          },
          'paypal_success'
        );

        if (transactionId) {
          localStorage.setItem(LAST_SHARED_PAYPAL_TX_KEY, transactionId);
        }
        localStorage.removeItem(PENDING_PAYPAL_ORDER_KEY);
        localStorage.setItem('bagoCart', JSON.stringify({}));
        trackOrderEvent(
          order.orderId,
          'paypal_whatsapp_open_requested',
          {
            transactionId: transactionId || null
          },
          'paypal_success'
        );
        armWhatsappConfirmationPrompt(order);
        const opened = openWhatsApp(whatsappUrl);
        if (!opened) {
          trackOrderEvent(
            order.orderId,
            'paypal_whatsapp_popup_blocked',
            {
              transactionId: transactionId || null
            },
            'paypal_success'
          );
        }

        window.addEventListener('blur', () => {
          markWhatsappConfirmationAsLeftPage();
        });
        window.addEventListener('pagehide', () => {
          markWhatsappConfirmationAsLeftPage();
        });
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'hidden') {
            markWhatsappConfirmationAsLeftPage();
          }
        });
      })();
    </script>
  </body>
</html>
